.veil{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(30,16,95,.34) 0%,rgba(14,8,52,.58) 26%,rgba(8,5,30,.80) 52%,rgba(8,5,30,.90) 78%,rgba(8,5,30,.95) 100%)}
.hero-copy{display:none}
.panel{flex:1;display:flex;flex-direction:column;width:100%;max-width:440px;margin:0 auto}

main{flex:1;padding:44px 28px 20px;display:flex;flex-direction:column}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:96px;height:96px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.wordmark{margin:10px 0 0;font-size:22px;font-weight:800;letter-spacing:.02em}
.wordmark b{color:var(--amber);font-weight:800}
.tag{margin:2px 0 0;font-size:13.5px;color:#e4e0fa}
.wordmark,.tag{text-shadow:0 1px 10px rgba(5,3,25,.95),0 0 3px rgba(5,3,25,.8)}
.field label,.hint,.terms{text-shadow:0 1px 8px rgba(5,3,25,.9)}

form{margin-top:30px}
.field{position:relative;margin-bottom:16px}
.field input[type=text],.field input[type=email],.field input[type=password]{
  width:100%;padding:22px 44px 8px 0;background:transparent;border:0;border-bottom:1.5px solid var(--line);
  color:var(--text);font:inherit;font-size:18px;outline:none;border-radius:0;
}
.field input::placeholder{color:transparent}
.field label{
  position:absolute;left:0;top:20px;font-size:18px;color:var(--muted);pointer-events:none;
  transform-origin:left top;transition:transform .15s ease,color .15s ease;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{transform:translateY(-17px) scale(.74);color:var(--amber)}
.field input:focus{border-bottom-color:var(--amber)}
.field input[aria-invalid=true]{border-bottom-color:var(--err)}
.field input:-webkit-autofill{-webkit-text-fill-color:var(--text);transition:background-color 9999s}
.eye{
  position:absolute;right:0;top:14px;width:38px;height:34px;border:0;background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;border-radius:8px;
}
.eye:hover{color:#fff}
.eye .off{display:none}
.eye[aria-pressed=true] .on{display:none}
.eye[aria-pressed=true] .off{display:block}
.hint{min-height:18px;margin:4px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.hint.error{color:var(--err)}
.meter{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:6px;font-size:12.5px;color:var(--amber)}
.meter i{display:block;width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.2)}
.meter i.on{background:var(--amber)}
.meter span{margin-left:6px;min-width:46px;text-align:right}

.terms{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px;font-size:13.5px;color:var(--text)}
.terms input{position:absolute;opacity:0;width:1px;height:1px}
.box{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--violet);display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);
}
.box svg{opacity:0}
.terms input:checked + .box svg{opacity:1}
.terms input:not(:checked) + .box{background:transparent}
.terms input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
.terms a{color:var(--amber);text-decoration:none}
.terms a:hover{text-decoration:underline}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.btn{
  display:grid;place-items:center;height:48px;border-radius:10px;font:inherit;font-size:16px;font-weight:600;
  color:#fff;text-decoration:none;cursor:pointer;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08);
  backdrop-filter:blur(4px);
}
.btn.primary{background:linear-gradient(135deg,#6a4be0,#3b2397);border-color:#a99bff;box-shadow:0 8px 22px rgba(70,40,190,.45)}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.eye:focus-visible,.nav-item:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:progress}

.passkey{display:flex;flex-direction:column;align-items:center;margin-top:22px;gap:10px;color:var(--text);font-size:14px}
.passkey button{
  width:68px;height:68px;border-radius:16px;border:1.5px solid rgba(255,255,255,.35);background:rgba(20,14,60,.7);
  color:#fff;display:grid;place-items:center;cursor:pointer;
}
.passkey button:hover{border-color:var(--amber);color:var(--amber)}
.passkey button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--nav-bg);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--nav-ink);text-decoration:none;font-size:10.5px;font-weight:600;padding:4px 0;border-radius:8px}
.nav-item:hover{background:rgba(58,42,140,.08)}

@media (max-height:700px){main{padding-top:24px}.logo{width:76px;height:76px}form{margin-top:18px}}

/* tablet: centered glass card over the photo */
@media (min-width:600px) and (max-width:1023px){
  .page{justify-content:center;align-items:center;padding:32px 16px}
  .veil{background:linear-gradient(180deg,rgba(30,16,95,.45),rgba(8,5,30,.80))}
  .panel{flex:none;border-radius:26px;overflow:hidden;background:rgba(8,5,30,.64);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  main{flex:none;padding-top:36px}
}

/* laptop / desktop: photo on the left, form on the right */
@media (min-width:1024px){
  .page{flex-direction:row}
  .photo,.veil{right:auto;width:56%}
  .photo{background-position:center 30%}
  .veil{background:
    linear-gradient(90deg,rgba(8,5,30,0) 62%,rgba(8,5,30,.92) 100%),
    linear-gradient(180deg,rgba(30,16,95,.38) 0%,rgba(8,5,30,.50) 50%,rgba(8,5,30,.90) 100%)}
  .hero-copy{display:block;position:absolute;left:clamp(40px,5vw,88px);bottom:clamp(48px,9vh,104px);width:calc(56% - clamp(80px,10vw,176px));max-width:520px}
  .hero-copy h2{margin:0 0 12px;font-size:clamp(34px,3.4vw,52px);line-height:1.08;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(5,3,25,.8)}
  .hero-copy h2 b{color:var(--amber)}
  .hero-copy p{margin:0;font-size:clamp(15px,1.2vw,18px);line-height:1.5;color:#e4e0fa;text-shadow:0 1px 14px rgba(5,3,25,.9)}
  .panel{width:44%;max-width:none;margin:0 0 0 56%;background:var(--ink)}
  main{justify-content:center;max-width:460px;width:100%;margin:0 auto;padding:40px 32px 24px}
  nav{background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.1);padding:12px 24px}
  .nav-item{color:#d6d0ff;font-size:12px}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
}
@media (min-width:1024px) and (max-height:860px){
  .logo{width:72px;height:72px}.wordmark{font-size:20px}form{margin-top:14px}.field{margin-bottom:8px}.passkey{margin-top:12px}
}
</style>
</head>
<body>
<div class="page">
<div class="photo" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<aside class="hero-copy">
  <h2>Build what&rsquo;s <b>next.</b></h2>
  <p>Create your NEXTbuild account to get started.</p>
</aside>

<div class="panel">
<main>
  <header class="brand">
    
<svg class="logo" viewBox="0 0 100 100" role="img" aria-label="NEXTbuild logo">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a9c"/><stop offset="1" stop-color="#150c52"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="#fff"/>
  <circle cx="50" cy="50" r="42" fill="url(#lg)"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#f2c46d" stroke-width="1.2" opacity="0.8"/>
  <rect x="22" y="50" width="12" height="22" rx="1" fill="#f2c46d" opacity="0.75"/>
  <rect x="34" y="28" width="24" height="44" rx="1.5" fill="#f2c46d"/>
  <rect x="58" y="42" width="14" height="30" rx="1" fill="#f2c46d" opacity="0.85"/>
  <g fill="#1d1170">
    <rect x="39" y="34" width="5" height="5"/><rect x="48" y="34" width="5" height="5"/>
    <rect x="39" y="44" width="5" height="5"/><rect x="48" y="44" width="5" height="5"/>
    <rect x="39" y="54" width="5" height="5"/><rect x="48" y="54" width="5" height="5"/>
    <rect x="62" y="48" width="5" height="5"/><rect x="62" y="58" width="5" height="5"/>
    <rect x="26" y="56" width="4" height="4"/><rect x="26" y="64" width="4" height="4"/>
  </g>
  <rect x="20" y="72" width="54" height="2.5" rx="1" fill="#fff"/>
</svg>

    <h1 class="wordmark">NEXT<b>build</b></h1>
    <p class="tag">Create your account</p>
  </header>

  <form id="signup" method="post" action="/signup" novalidate>
    <div class="field">
      <input id="name" name="name" type="text" placeholder=" " autocomplete="name" required aria-describedby="name-msg">
      <label for="name">Full name</label>
      <p class="hint" id="name-msg" aria-live="polite"></p>
    </div>

    <div class="field">
      <input id="email" name="email" type="email" placeholder=" " autocomplete="email" inputmode="email" required aria-describedby="email-msg">
      <label for="email">Work email</label>
      <p class="hint" id="email-msg" aria-live="polite"></p>
    </div>

    <div class="field">
      <input id="password" name="password" type="password" placeholder=" " autocomplete="new-password" required minlength="8" aria-describedby="pw-msg">
      <label for="password">Password</label>
      <button class="eye" type="button" id="toggle" aria-label="Show password" aria-pressed="false">
        <span class="on"><svg class="" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="off"><svg class="" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></span>
      </button>
      <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><span id="pw-label"></span></div>
      <p class="hint" id="pw-msg" aria-live="polite"></p>
    </div>

    <label class="terms">
      <input id="terms" name="terms" type="checkbox" required>
      <span class="box"><svg class="" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span>I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a></span>
    </label>
    <p class="hint" id="terms-msg" aria-live="polite"></p>

    <div class="actions">
      <button class="btn primary" type="submit" id="submit">Sign up</button>
      <a class="btn" href="/login">Log in</a>
    </div>
  </form>

  <div class="passkey">
    <button type="button" id="passkey" aria-label="Sign up with a passkey"><svg class="" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></button>
    <span>Sign up with Passkey</span>
  </div>
</main>

<nav aria-label="Product">
<a class="nav-item" href="#features"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Features</span></a>
<a class="nav-item" href="#pricing"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12.5V4.5A1.5 1.5 0 0 1 4.5 3h8l8.5 8.5-9 9z"/><circle cx="8" cy="8" r="1.4"/></svg><span>Pricing</span></a>
<a class="nav-item" href="#docs"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V4.5"/><path d="M9 7h7"/></svg><span>Docs</span></a>
<a class="nav-item" href="#security"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span>Security</span></a>
<a class="nav-item" href="#support"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg><span>Support</span></a>
<a class="nav-item" href="#status"><svg class="" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg><span>Status</span></a>
</nav>
</div>
</div>

<script>
(function () {
  var form = document.getElementById('signup');
  var pw = document.getElementById('password');
  var toggle = document.getElementById('toggle');
  var bars = document.querySelectorAll('.meter i');
  var label = document.getElementById('pw-label');

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function score(v) {
    var s = 0;
    if (v.length >= 8) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v) || v.length >= 14) s++;
    return v ? Math.max(s, 1) : 0;
  }
  pw.addEventListener('input', function () {
    var s = score(pw.value);
    for (var i = 0; i < bars.length; i++) bars[i].className = i < s ? 'on' : '';
    label.textContent = ['', 'Weak', 'Fair', 'Good', 'Strong'][s];
  });

  function setMsg(id, input, text) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = 'hint' + (text ? ' error' : '');
    if (input) input.setAttribute('aria-invalid', text ? 'true' : 'false');
    return !text;
  }

  var msgFor = { name: 'name-msg', email: 'email-msg', password: 'pw-msg', terms: 'terms-msg' };
  form.addEventListener('input', function (e) {
    var id = msgFor[e.target.name];
    if (id) setMsg(id, e.target.name === 'terms' ? null : e.target, '');
  });

  form.addEventListener('submit', function (e) {
    var name = form.elements.name, email = form.elements.email, terms = form.elements.terms;
    var checks = [
      [setMsg('name-msg', name, name.value.trim() ? '' : 'Please enter your full name.'), name],
      [setMsg('email-msg', email, /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim()) ? '' : 'Enter a valid work email.'), email],
      [setMsg('pw-msg', pw, pw.value.length >= 8 ? '' : 'Use at least 8 characters.'), pw],
      [setMsg('terms-msg', null, terms.checked ? '' : 'Please accept the terms to continue.'), terms]
    ];
    for (var i = 0; i < checks.length; i++) {
      if (!checks[i][0]) { e.preventDefault(); checks[i][1].focus(); return; }
    }
    document.getElementById('submit').disabled = true;
  });

  document.getElementById('passkey').addEventListener('click', function () {
    if (!window.PublicKeyCredential) {
      setMsg('terms-msg', null, 'Passkeys are not supported on this device.');
    }
    /* Hook your WebAuthn registration flow here. */
  });
})();
</script>
</body>
</html>
